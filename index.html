<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7eecf"><title>もじモンスター</title>
<style>
:root{font-family:system-ui,"Hiragino Kaku Gothic ProN",sans-serif;color:#40352f;background:#f7eecf}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;cursor:pointer;border:0;touch-action:manipulation}.app{height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#bfeaf4 0%,#f2f8e9 69%,#c5e6a0 70%,#a9d67f 100%)}header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;z-index:2}.logo{font-size:clamp(21px,5vw,31px);font-weight:1000;letter-spacing:.04em;text-shadow:2px 3px #fff}.pill{background:#fff8e9;border:2px solid #5b493d;border-radius:99px;padding:9px 14px;font-weight:800;box-shadow:0 4px #c8b9a1}.world{flex:1;min-height:0;position:relative}#world{width:100%;height:100%;display:block}.bottom{display:flex;justify-content:center;gap:12px;padding:12px 16px max(18px,env(safe-area-inset-bottom));z-index:2}.primary{background:#ff7c7b;color:#3e2c30;border:3px solid #573b3b;border-radius:22px;padding:15px 28px;font-size:20px;font-weight:1000;box-shadow:0 6px #ba515b}.secondary{background:#fff9e9;border:3px solid #5b493d;border-radius:20px;padding:14px 18px;font-weight:900;box-shadow:0 5px #c9bba4}.primary:active,.secondary:active{transform:translateY(3px);box-shadow:none}.hint{position:absolute;top:15%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#ffffffbd;border-radius:30px;padding:12px 18px;font-weight:800;pointer-events:none}.overlay{position:fixed;inset:0;background:#332b2b99;display:none;align-items:center;justify-content:center;padding:15px;z-index:10}.overlay.show{display:flex}.panel{width:min(100%,470px);background:#fffaf0;border:4px solid #564438;border-radius:30px;padding:17px;box-shadow:0 14px 0 #483a36;max-height:95dvh;overflow:auto}.panel h2{margin:0 0 5px;font-size:25px;text-align:center}.sub{text-align:center;font-size:13px;margin:0 0 10px}.drawbox{position:relative;background:#fff;border:3px dashed #d7cbb8;border-radius:22px;overflow:hidden;aspect-ratio:1.25}#draw{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}.guide{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;font-size:16px;color:#d3c8b6}.colors{display:flex;justify-content:center;gap:12px;margin:12px}.swatch{width:35px;height:35px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #b7a997}.swatch.selected{box-shadow:0 0 0 3px #40352f;transform:scale(1.12)}.actions{display:flex;gap:10px}.actions button{flex:1}.note{font-size:12px;color:#78695d;text-align:center;margin:11px 0 0}.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #514236;border-radius:20px;padding:10px 16px;font-weight:800;z-index:20;pointer-events:none;opacity:0;transition:opacity .25s}.toast.show{opacity:1}@media(max-height:680px){.panel{padding:10px}.drawbox{aspect-ratio:1.7}.panel h2{font-size:21px}.colors{margin:8px}}
.toptools{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:10px;z-index:3}.tool{width:49px;height:49px;border-radius:16px;background:#fff9e9;border:2px solid #5b493d;box-shadow:0 4px #c8b9a1;font-size:24px;font-weight:900}.bottom{padding-bottom:max(24px,env(safe-area-inset-bottom))}.bottom .primary{min-width:min(78vw,330px);font-size:22px}.bottom{padding:6px 10px max(9px,env(safe-area-inset-bottom));justify-content:center}.inline-draw{width:min(100%,460px);background:#fffaf0;border:2px solid #655448;border-radius:21px;padding:8px 10px 9px;box-shadow:0 3px 0 #b9ad94}.inline-label{text-align:center;font-weight:900;font-size:13px;line-height:18px}.inline-draw .drawbox{height:clamp(105px,20dvh,170px);aspect-ratio:auto;border-width:2px;border-radius:13px}.inline-draw .draw-controls{display:flex;align-items:center;gap:7px;margin-top:7px}.inline-draw .colors{display:flex;gap:5px;margin:0;flex:1;justify-content:flex-start}.inline-draw .swatch{width:clamp(20px,5.2vw,29px);height:clamp(20px,5.2vw,29px);border-width:2px}.inline-draw .secondary{padding:7px 11px;border-width:2px;border-radius:12px;font-size:20px;box-shadow:none}.inline-draw .primary{min-width:0;padding:9px 13px;font-size:15px;border-width:2px;border-radius:13px;box-shadow:none;white-space:nowrap}.hint{top:12%}@media(max-height:650px){.inline-draw .drawbox{height:100px}.inline-label{display:none}} .inline-draw .draw-controls{gap:9px}.inline-draw .color-cycle{width:46px;height:46px;min-width:46px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #5b493d;cursor:pointer}.inline-draw .secondary{min-height:46px;font-size:17px}.inline-draw .primary{min-height:46px;flex:1;font-size:18px;padding:8px 10px}.inline-draw .upload{font-size:14px;white-space:nowrap;padding:8px 9px}.inline-draw{padding-top:9px}.inline-draw .drawbox{height:clamp(115px,22dvh,180px)}@media(max-width:350px){.inline-draw .draw-controls{gap:6px}.inline-draw .color-cycle{width:42px;height:42px;min-width:42px}.inline-draw .upload{font-size:12px;padding:6px}.inline-draw .primary{font-size:16px}} </style></head><body><div class="app"><div class="toptools"><button id="photo" class="tool" aria-label="写真を保存" title="写真を保存">📷</button><button id="reset" class="tool" aria-label="はじめから" title="はじめから">↺</button></div><main class="world"><canvas id="world"></canvas><div class="hint" id="hint">じぶんの もじを うごかそう！</div></main><footer class="bottom"><section class="inline-draw"><div class="drawbox"><canvas id="draw"></canvas></div><div class="draw-controls"><button id="color-cycle" class="color-cycle" aria-label="色を変更" title="タップして色を変更"></button><button id="clear" class="secondary" aria-label="書き直す">↺</button><button id="summon" class="primary">うかべる</button><button id="upload" class="secondary upload" aria-label="画像をアップロード">画像追加</button><input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></div></section></footer></div>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{
const $=id=>document.getElementById(id),world=$('world'),wc=world.getContext('2d'),draw=$('draw'),dc=draw.getContext('2d');
const colors=['#ef7180','#6c88df','#50ad91','#d99439','#8b73b9','#4e6671'];let color=colors[0],strokes=[],current=null,monsters=[],drawing=false,w=0,h=0,last=performance.now(),tick=0;
function fit(c){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);const ctx=c.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return [r.width,r.height]}
function resize(){[w,h]=fit(world);fit(draw);renderDrawing()}addEventListener('resize',resize);
const cycle=$('color-cycle');function updateCycle(){cycle.style.background=color}updateCycle();cycle.onclick=()=>{color=colors[(colors.indexOf(color)+1)%colors.length];updateCycle();renderDrawing()};
function show(v){if(!v){strokes=[];current=null;renderDrawing()}}
$('clear').onclick=()=>{strokes=[];current=null;renderDrawing()};
function pt(e){const r=draw.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
draw.addEventListener('pointerdown',e=>{e.preventDefault();draw.setPointerCapture(e.pointerId);drawing=true;current=[pt(e)];strokes.push(current);renderDrawing()});
draw.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();current.push(pt(e));renderDrawing()});
function end(){drawing=false;current=null}draw.addEventListener('pointerup',end);draw.addEventListener('pointercancel',end);
function ink(ctx,paths,c,scale=1){ctx.strokeStyle=c;ctx.lineWidth=13*scale;ctx.lineCap='round';ctx.lineJoin='round';for(const path of paths){if(!path.length)continue;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);if(path.length===1){ctx.lineTo(path[0].x+.01,path[0].y+.01)}else for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke()}}
function renderDrawing(){const r=draw.getBoundingClientRect(),dw=r.width,dh=r.height;dc.clearRect(0,0,dw,dh);dc.save();dc.scale(dw,dh);ink(dc,strokes,color,.0014);dc.restore();}
function bounds(paths){let minX=1,minY=1,maxX=0,maxY=0;for(const p of paths)for(const q of p){minX=Math.min(minX,q.x);minY=Math.min(minY,q.y);maxX=Math.max(maxX,q.x);maxY=Math.max(maxY,q.y)}return{minX,minY,maxX,maxY,width:Math.max(.05,maxX-minX),height:Math.max(.05,maxY-minY)}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('summon').onclick=()=>{if(!strokes.length){toast('もじを かいてね！');return}const b=bounds(strokes),size=Math.min(125,Math.max(85,w*.23)),unit=size/Math.max(b.width,b.height),cx=(b.minX+b.maxX)/2,cy=(b.minY+b.maxY)/2;const paths=strokes.map(p=>p.map(q=>({x:(q.x-cx)*unit,y:(q.y-cy)*unit})));const m={paths,color,x:Math.max(70,Math.random()*(w-140)+70),y:Math.max(90,Math.random()*(h-190)+95),vx:(Math.random()>.5?1:-1)*(12+Math.random()*28),vy:(Math.random()-.5)*20,turnIn:0.3+Math.random()*2.5,phase:Math.random()*6.28,age:0,size,faceY:-Math.min(12,b.height*unit*.18),eyeOffset:Math.min(14,b.width*unit*.17)};monsters.push(m);if(monsters.length>12)monsters.shift();$('hint').style.display='none';show(false);toast('モンスターが うまれた！')};
function bg(ctx){ctx.fillStyle='#ffffff70';for(let i=0;i<8;i++){const x=(i*157+43)%Math.max(w,1),y=45+(i*73)%Math.max(h*.45,1);ctx.beginPath();ctx.arc(x,y,4+(i%3)*2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ffffff9a';for(const [x,y,s] of [[.18,.17,1],[.75,.27,.8]]){ctx.beginPath();ctx.ellipse(w*x,h*y,37*s,13*s,0,0,Math.PI*2);ctx.ellipse(w*x-20*s,h*y-7*s,22*s,15*s,0,0,Math.PI*2);ctx.ellipse(w*x+16*s,h*y-8*s,25*s,17*s,0,0,Math.PI*2);ctx.fill()}}
function monster(ctx,m,t){const bob=Math.sin(t*3+m.phase)*5;ctx.save();ctx.translate(m.x,m.y+bob);const bounce=1+Math.sin(t*3+m.phase)*.035;ctx.scale(1/bounce,bounce);ctx.rotate(Math.sin(t*1.7+m.phase)*.055);ctx.globalAlpha=Math.min(1,m.age*3);if(m.image){const iw=m.image.width,ih=m.image.height,scale=Math.min(94/iw,94/ih);ctx.drawImage(m.image,-iw*scale/2,-ih*scale/2,iw*scale,ih*scale);ctx.restore();return}ctx.strokeStyle='#51443e';ctx.lineWidth=5;ctx.lineCap='round';const foot=m.size*.28;for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(s*19,foot-7);ctx.quadraticCurveTo(s*24,foot+13+Math.sin(t*5+m.phase+s)*6,s*33,foot+18);ctx.stroke()}ink(ctx,m.paths,m.color,1);const fy=m.faceY;ctx.fillStyle='#fff';ctx.strokeStyle='#55453f';ctx.lineWidth=2.5;for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(s*m.eyeOffset,fy,9,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#322c32';ctx.beginPath();ctx.arc(s*m.eyeOffset+Math.sin(t*.8+m.phase)*2,fy+1,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff'}ctx.strokeStyle='#493638';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(0,fy+15,5,0,Math.PI);ctx.stroke();ctx.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick+=dt;wc.clearRect(0,0,w,h);bg(wc);for(const m of monsters){m.age+=dt;m.turnIn-=dt;if(m.turnIn<=0){m.turnIn=.4+Math.random()*2.8;const a=Math.random()*Math.PI*2,speed=10+Math.random()*40;m.vx=Math.cos(a)*speed;m.vy=Math.sin(a)*speed}m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<40){m.x=40;m.vx=Math.abs(m.vx)}if(m.x>w-40){m.x=w-40;m.vx=-Math.abs(m.vx)}if(m.y<45){m.y=45;m.vy=Math.abs(m.vy)}if(m.y>h-40){m.y=h-40;m.vy=-Math.abs(m.vy)}monster(wc,m,tick)}requestAnimationFrame(frame)}
$('upload').onclick=()=>$('image-input').click();$('image-input').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('画像を選んでね');return}try{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);const m={image:img,x:Math.max(50,Math.random()*Math.max(1,w-100)+50),y:Math.max(50,Math.random()*Math.max(1,h-100)+50),vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*30,turnIn:1,phase:Math.random()*6.28,age:0};monsters.push(m);if(monsters.length>12)monsters.shift();$('hint').style.display='none';toast('画像をうかべたよ！')};img.onerror=()=>{URL.revokeObjectURL(url);toast('画像を読み込めませんでした')};img.src=url}catch(err){toast('画像を読み込めませんでした')}e.target.value=''});
$('photo').onclick=()=>{const out=document.createElement('canvas');out.width=1200;out.height=1200;const c=out.getContext('2d');c.fillStyle='#ccecf0';c.fillRect(0,0,1200,1200);c.fillStyle='#b7dd94';c.fillRect(0,880,1200,320);const s=Math.min(1200/Math.max(w,1),1000/Math.max(h,1));c.save();c.translate((1200-w*s)/2,(1000-h*s)/2+90);c.scale(s,s);for(const m of monsters)monster(c,m,tick);c.restore();c.fillStyle='#5b4c42';c.font='bold 42px sans-serif';c.fillText('もじモンスター',38,68);out.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moji-monster.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};
$('reset').onclick=()=>{monsters=[];$('hint').style.display='block';toast('また あそぼう！')};resize();requestAnimationFrame(frame);
})();
</script></body></html>
