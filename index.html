(()=>{

let lastSpark=0;
function sparkle(x,y,burst=false){if(document.hidden)return;const count=burst?9:1;for(let i=0;i<count;i++){const el=document.createElement('span'),star=burst||Math.random()>.55;el.className='fx-dot'+(star?' star':'');if(star)el.textContent=['✦','✧','★'][Math.floor(Math.random()*3)];el.style.left=x+'px';el.style.top=y+'px';el.style.setProperty('--fx-color',['#ff8ca6','#ffd36d','#7ac9e8','#a4dfab'][Math.floor(Math.random()*4)]);if(star)el.style.color=['#ff8ca6','#ffc14c','#7ac9e8','#94cfa1'][Math.floor(Math.random()*4)];el.style.setProperty('--dx',(burst?(Math.random()-.5)*85:(Math.random()-.5)*23)+'px');el.style.setProperty('--dy',(burst?(Math.random()-.5)*85:-18-Math.random()*16)+'px');pointerFx.append(el);el.addEventListener('animationend',()=>el.remove(),{once:true});setTimeout(()=>el.remove(),900)}}

let audioCtx=null,lastDrawSound=0;

function soundFloat(){tone(440,.13,'sine',.06);tone(660,.17,'sine',.06,.11);tone(880,.23,'sine',.05,.24)}

const bgm=new Audio('./Through_the_Garden_Gate.mp3');bgm.loop=true;bgm.volume=.28;bgm.preload='auto';let bgmUnlocked=false;
function startBgm(){if(document.hidden)return;bgmUnlocked=true;bgm.play().catch(()=>{})}

const cycle=$('color-cycle'),palette=$('color-palette');let holdTimer=null,holdFired=false,holdStart=null,suppressClick=false;
function updateCycle(){cycle.style.background=color;cycle.style.borderColor=color==='#ffffff'?'#aaa':'#fff';cycle.setAttribute('aria-label','現在の色：'+(paletteColors.find(p=>p[1]===color)?.[0]||'色')+'。タップで次の色、長押しで全色')}

paletteColors.forEach(([name,hex])=>{const b=document.createElement('button');b.type='button';b.className='palette-swatch';b.dataset.color=hex;b.style.background=hex;b.setAttribute('aria-label',name);b.title=name;b.onclick=()=>{color=hex;updateCycle();closePalette();renderDrawing()};palette.append(b)});
updateCycle();
cycle.addEventListener('pointerdown',e=>{if(e.button!==0)return;holdFired=false;holdStart={x:e.clientX,y:e.clientY};clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holdFired=true;suppressClick=true;openPalette();if(navigator.vibrate)navigator.vibrate(20)},480)});
cycle.addEventListener('pointermove',e=>{if(holdStart&&Math.hypot(e.clientX-holdStart.x,e.clientY-holdStart.y)>12)clearTimeout(holdTimer)});

cycle.addEventListener('contextmenu',e=>{e.preventDefault();clearTimeout(holdTimer);holdFired=true;suppressClick=true;openPalette()});
cycle.onclick=()=>{if(suppressClick||holdFired){suppressClick=false;holdFired=false;return}if(!palette.hidden){closePalette();return}color=colors[(colors.indexOf(color)+1)%colors.length];updateCycle();renderDrawing()};
document.addEventListener('pointerdown',e=>{if(!palette.hidden&&!e.target.closest('.color-picker'))closePalette()});
function cancelFloat(){if(floatTimer!==null){clearTimeout(floatTimer);floatTimer=null}draw.parentElement.classList.remove('waiting')}
function scheduleFloat(){cancelFloat();if(!strokes.length&&!pendingImage)return;draw.parentElement.classList.add('waiting');floatTimer=setTimeout(()=>{floatTimer=null;draw.parentElement.classList.remove('waiting');if(!drawing)floatEditor()},5000)}
function show(v){if(!v){cancelFloat();strokes=[];current=null;pendingImage=null;renderDrawing()}}
$('clear').onclick=()=>{cancelFloat();strokes=[];current=null;pendingImage=null;renderDrawing()};
function pt(e){const r=draw.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}

$('bomb').onclick=()=>{bombMode=!bombMode;$('bomb').classList.toggle('active',bombMode);$('bomb').setAttribute('aria-pressed',String(bombMode));$('bomb').setAttribute('aria-label',bombMode?'爆弾モードをオフ':'爆弾モードをオン');world.style.cursor=bombMode?'crosshair':'default';toast(bombMode?'キャラクターをタップしてね':'爆弾モードを終了')};world.addEventListener('pointerdown',e=>{if(!bombMode)return;const r=world.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;for(let i=monsters.length-1;i>=0;i--){const m=monsters[i],radius=m.image?Math.min(85,w*.22):Math.max(42,(m.size||75)*.65);if(Math.hypot(x-m.x,y-m.y)<radius){if(!m.bombEnd){m.bombEnd=performance.now()+10000;m.lastBombSecond=11;soundTick(10);toast('10秒後に爆発！')}else toast('カウントダウン中！');break}}});
function explode(m){soundExplosion();for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,sp=35+Math.random()*110;particles.push({x:m.x,y:m.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:.55+Math.random()*.45,max:1,color:['#ffdc6c','#ff8c6c','#ffffff','#e66d62'][i%4],r:3+Math.random()*7})}}
function bg(ctx){ctx.fillStyle='#ffffff70';for(let i=0;i<8;i++){const x=(i*157+43)%Math.max(w,1),y=45+(i*73)%Math.max(h*.45,1);ctx.beginPath();ctx.arc(x,y,4+(i%3)*2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#ffffff9a';for(const [x,y,s] of [[.18,.17,1],[.75,.27,.8]]){ctx.beginPath();ctx.ellipse(w*x,h*y,37*s,13*s,0,0,Math.PI*2);ctx.ellipse(w*x-20*s,h*y-7*s,22*s,15*s,0,0,Math.PI*2);ctx.ellipse(w*x+16*s,h*y-8*s,25*s,17*s,0,0,Math.PI*2);ctx.fill()}}
function monster(ctx,m,t){const bob=Math.sin(t*3+m.phase)*5;ctx.save();ctx.translate(m.x,m.y+bob);const bounce=1+Math.sin(t*3+m.phase)*.035;ctx.scale(1/bounce,bounce);ctx.rotate(Math.sin(t*1.7+m.phase)*.055);ctx.globalAlpha=Math.min(1,m.age*3);if(m.image){const iw=m.image.width,ih=m.image.height,scale=Math.min(Math.min(160,w*.4)/iw,Math.min(170,h*.34)/ih);ctx.drawImage(m.image,-iw*scale/2,-ih*scale/2,iw*scale,ih*scale);ctx.restore();return}ctx.strokeStyle='#51443e';ctx.lineWidth=5;ctx.lineCap='round';const foot=m.size*.28;for(const s of [-1,1]){ctx.beginPath();ctx.moveTo(s*19,foot-7);ctx.quadraticCurveTo(s*24,foot+13+Math.sin(t*5+m.phase+s)*6,s*33,foot+18);ctx.stroke()}for(const path of m.paths)ink(ctx,[path],path.inkColor||m.color,1);const fy=m.faceY;ctx.fillStyle='#fff';ctx.strokeStyle='#55453f';ctx.lineWidth=2.5;for(const s of [-1,1]){ctx.beginPath();ctx.ellipse(s*m.eyeOffset,fy,9,11,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#322c32';ctx.beginPath();ctx.arc(s*m.eyeOffset+Math.sin(t*.8+m.phase)*2,fy+1,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff'}ctx.strokeStyle='#493638';ctx.lineWidth=2.4;ctx.beginPath();ctx.arc(0,fy+15,5,0,Math.PI);ctx.stroke();ctx.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;tick+=dt;wc.clearRect(0,0,w,h);bg(wc);for(let i=monsters.length-1;i>=0;i--){const m=monsters[i];if(m.bombEnd&&now>=m.bombEnd){explode(m);monsters.splice(i,1);continue}m.age+=dt;m.turnIn-=dt;if(m.turnIn<=0){m.turnIn=.4+Math.random()*2.8;const a=Math.random()*Math.PI*2,speed=10+Math.random()*40;m.vx=Math.cos(a)*speed;m.vy=Math.sin(a)*speed}m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<40){m.x=40;m.vx=Math.abs(m.vx)}if(m.x>w-40){m.x=w-40;m.vx=-Math.abs(m.vx)}if(m.y<45){m.y=45;m.vy=Math.abs(m.vy)}if(m.y>h-40){m.y=h-40;m.vy=-Math.abs(m.vy)}monster(wc,m,tick);if(m.bombEnd){const remaining=Math.max(0,Math.ceil((m.bombEnd-now)/1000));if(remaining!==m.lastBombSecond){m.lastBombSecond=remaining;soundTick(remaining)}wc.save();wc.font='900 22px system-ui';wc.textAlign='center';wc.lineWidth=4;wc.strokeStyle='#513b37';wc.fillStyle='#fff';wc.strokeText('💣 '+remaining,m.x,m.y-57);wc.fillText('💣 '+remaining,m.x,m.y-57);wc.restore()}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;wc.globalAlpha=Math.min(1,p.life*2);wc.fillStyle=p.color;wc.beginPath();wc.arc(p.x,p.y,p.r*Math.min(1,p.life*2),0,Math.PI*2);wc.fill()}wc.globalAlpha=1;requestAnimationFrame(frame)}
$('upload').onclick=()=>$('image-input').click();$('image-input').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('画像を選んでね');return}try{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{URL.revokeObjectURL(url);cancelFloat();pendingImage=img;strokes=[];renderDrawing();scheduleFloat()};img.onerror=()=>{URL.revokeObjectURL(url);toast('画像を読み込めませんでした')};img.src=url}catch(err){toast('画像を読み込めませんでした')}e.target.value=''});
$('photo').onclick=()=>{const out=document.createElement('canvas');out.width=1200;out.height=1200;const c=out.getContext('2d');c.fillStyle='#ccecf0';c.fillRect(0,0,1200,1200);c.fillStyle='#b7dd94';c.fillRect(0,880,1200,320);const s=Math.min(1200/Math.max(w,1),1000/Math.max(h,1));c.save();c.translate((1200-w*s)/2,(1000-h*s)/2+90);c.scale(s,s);for(const m of monsters)monster(c,m,tick);c.restore();c.fillStyle='#5b4c42';c.font='bold 42px sans-serif';c.fillText('うかべてあそぼ',38,68);out.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ukabete-asobo.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')};
$('reset').onclick=()=>{monsters=[];particles=[];$('hint').style.display='block';toast('また あそぼう！')};resize();requestAnimationFrame(frame);
})();
</script></body></html>
