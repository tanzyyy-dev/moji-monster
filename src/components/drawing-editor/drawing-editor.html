<button type="button" id="editor-mode" class="editor-mode pictorial-tool" aria-label="おえかきをひろげる" aria-controls="drawing-panel">
  <img class="mode-pencil lucide-icon" src="./assets/icons/pencil.svg" alt="" />
  <svg class="mode-window" viewBox="0 0 24 24" aria-hidden="true">
    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
    <path class="mode-half mode-bottom" d="M4 12h16v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path>
    <path class="mode-half mode-right" d="M12 5h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6z"></path>
    <rect class="mode-full" x="6" y="7" width="12" height="10" rx="1"></rect>
  </svg>
</button>
<section id="drawing-panel" class="inline-draw">
  <div class="style-tools" role="group" aria-label="いろとめだま">
    <div>
      <button
        id="color-cycle"
        class="color-cycle"
        aria-label="いろをえらぶ"
        aria-haspopup="true"
        aria-expanded="false"
        title="色を選ぶ"
      ></button>
      <div id="color-palette" class="color-palette" role="group" aria-label="色" hidden>
        <div id="palette-colors" class="palette-colors" role="group" aria-label="色"></div>
      </div>
    </div>
    <button type="button" id="fill-toggle" class="pictorial-tool toggle-tool" aria-label="ぬりつぶし" aria-pressed="false">
      <img class="lucide-icon" src="./assets/icons/paint-bucket.svg" alt="" />
    </button>
    <button type="button" id="face-toggle" class="pictorial-tool toggle-tool" aria-label="めだまをつける" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <ellipse cx="7" cy="12" rx="4" ry="6"></ellipse>
        <ellipse cx="17" cy="12" rx="4" ry="6"></ellipse>
        <circle cx="8" cy="12" r="1" fill="currentColor"></circle>
        <circle cx="18" cy="12" r="1" fill="currentColor"></circle>
        <path class="eyes-off" d="M3 3l18 18"></path>
      </svg>
    </button>
  </div>
  <div class="repair-tools" role="group" aria-label="かきなおし">
    <button type="button" id="eraser-toggle" class="pictorial-tool toggle-tool" aria-label="けしごむ" aria-pressed="false">
      <img class="lucide-icon" src="./assets/icons/eraser.svg" alt="" />
    </button>
    <button type="button" id="undo" class="pictorial-tool" aria-label="ひとつまえにもどす" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5l-5 5 5 5M3 10h11a5 5 0 0 1 0 10h-3"></path>
      </svg>
    </button>
    <button type="button" id="clear" class="pictorial-tool" aria-label="ぜんぶけす" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 10 7 5l7-2 3 7M10 6.8l1.5 1 1.5-1.3"></path>
        <path d="M3.5 10.5h17M5 10.5l1.4 8.8a2 2 0 0 0 2 1.7h7.2a2 2 0 0 0 2-1.7l1.4-8.8M10 14v3.5m4-3.5v3.5"></path>
      </svg>
    </button>
  </div>
  <div class="paper-space">
    <div class="drawbox">
      <canvas id="draw"></canvas>
      <div class="swipe-hint" aria-live="polite">
        <img class="lucide-icon" src="./assets/icons/timer.svg" alt="" />
        <span id="countdown-number">5</span>
      </div>
    </div>
  </div>
  <div class="drawing-tools" role="group" aria-label="おえかきのどうぐ">
    <div class="brush-picker">
      <button
        id="brush-cycle"
        class="pictorial-tool"
        aria-label="せんのふとさをえらぶ"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <img class="lucide-icon" src="./assets/icons/pencil.svg" alt="" />
      </button>
      <div id="brush-menu" class="brush-menu" role="group" aria-label="せんのふとさ" hidden></div>
    </div>
    <div class="asset-picker">
      <button
        id="asset-cycle"
        class="pictorial-tool"
        aria-label="ぬりえをえらぶ"
        aria-haspopup="true"
        aria-expanded="false"
        title="ぬりえ"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="6" cy="6" r="3"></circle>
          <path d="M16 3l4 7h-8z"></path>
          <rect x="7" y="14" width="10" height="7" rx="1"></rect>
        </svg>
      </button>
      <div
        id="asset-list"
        class="asset-list"
        role="group"
        aria-label="ぬりえをえらぶ"
        hidden
      ></div>
    </div>
    <button type="button" id="image-upload" class="pictorial-tool" aria-label="しゃしんをえらぶ">
      <img class="lucide-icon" src="./assets/icons/image.svg" alt="" />
    </button>
    <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
  </div>
  <button type="button" id="finish" class="finish" aria-label="できた">できた</button>
</section>
